name: Build and Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  AWS_REGION: ap-south-2
  EC2_TARGET_DIR: /var/www/frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Create .env
      - name: Create .env
        run: |
          echo "${{ secrets.REACT_ENV_FILE }}" > .env

      # Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Verify Node
      - name: Verify Node Version
        run: |
          node -v
          npm -v

      # Install Dependencies
      - name: Install Dependencies
        run: npm install

      # Build
      - name: Build React
        run: npm run build

      # Verify Build
      - name: Verify Build
        run: |
          ls -la
          ls -la dist

      # Archive
      - name: Create Archive
        run: |
          tar -czf frontend.tar.gz -C dist .
          ls -lh frontend.tar.gz

      # Release Tag
      - name: Set Release Tag
        run: |
          echo "RELEASE_TAG=frontend-${GITHUB_SHA}" >> $GITHUB_ENV

      # Create Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Frontend Release ${{ github.sha }}
          files: frontend.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify AWS
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Verify SSM
      - name: Verify SSM
        run: |
          aws ssm describe-instance-information \
            --region $AWS_REGION \
            --query "InstanceInformationList[*].InstanceId"

      # Deploy
      - name: Deploy via SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Frontend Deployment" \
            --parameters "commands=[
            \"set -e\",
            \"echo ===== START DEPLOY =====\",
            \"RELEASE_URL=https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/frontend.tar.gz\",
            \"echo Download URL: \$RELEASE_URL\",
            \"mkdir -p /tmp/frontend\",
            \"rm -rf /tmp/frontend/*\",

            \"for i in {1..10}; do curl -L \$RELEASE_URL -o /tmp/frontend/frontend.tar.gz && break; echo Waiting for GitHub Release...; sleep 5; done\",

            \"ls -lh /tmp/frontend\",

            \"sudo mkdir -p $EC2_TARGET_DIR\",

            \"sudo rm -rf $EC2_TARGET_DIR/*\",

            \"sudo tar -xzf /tmp/frontend/frontend.tar.gz -C $EC2_TARGET_DIR\",

            \"rm -rf /tmp/frontend\",

            \"echo Deployment Complete\",

            \"ls -la $EC2_TARGET_DIR\",

            \"sudo nginx -t\",

            \"sudo systemctl reload nginx\",

            \"echo ===== FINISHED =====\"

            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      # Wait
      - name: Wait for Deployment
        run: sleep 15

      # Status
      - name: Check Deployment Status
        run: |
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --region $AWS_REGION